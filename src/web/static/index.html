<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delivery Support Chat</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 0 12px rgba(0,0,0,0.08);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .customer {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #f0f1f3;
    color: #111;
    border-bottom-left-radius: 4px;
  }
  .bot.pending { color: #888; font-style: italic; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid #eee;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: #2563eb; }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #a9bce8; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>Delivery Support Chat</header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const sessionId = crypto.randomUUID();
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addBubble(text, role) {
    const el = document.createElement("div");
    el.className = "bubble " + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addBubble(message, "customer");
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    const pending = addBubble("...", "bot pending");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      const data = await res.json();
      pending.textContent = data.reply;
      pending.classList.remove("pending");
    } catch (err) {
      pending.textContent = "Error reaching the server.";
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
